<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060606">
<title>band. portal</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div id="app"></div>
<div id="login" hidden></div>
<div id="pal"><div class="pbox"><input id="palIn" placeholder="Jump to…" autocomplete="off" spellcheck="false"><div class="list" id="palList"></div><div class="hint mono"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div></div></div>
<div id="toast"></div>
<noscript><p style="position:relative;color:#fff;padding:40px;font:16px/1.6 sans-serif">The portal needs JavaScript. Email band.digi.tech@gmail.com and we will help.</p></noscript>
<script>/* the portal needs its server, which lives on Vercel; the GitHub Pages copy of the site sends people there */ if (/\.github\.io$/.test(location.hostname)) location.replace('https://band-os-omega.vercel.app/portal/' + location.hash);</script>
<script type="module" src="main.js"></script>
</body>
</html>
