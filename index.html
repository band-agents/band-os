<style>
/* 06 · STUDIO OS — the portfolio is the studio's own desktop. It boots with the barcode, work lives in
   folders and windows you can drag, and the assistant is the command bar: ⌘K, type anything, it answers and
   opens the right windows for you. */
:root{--desk:#ECECE6;--win:#FFFFFF;--ink:#0B0B0B;--mute:#83837C;--rule:#E2E2DB;--green:#10A862;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 15px/1.5 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* boot */
#boot{position:fixed;inset:0;z-index:100;background:#050505;color:#EDEDE6;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#boot.gone{opacity:0;visibility:hidden}
#boot canvas{width:min(300px,64vw);height:min(220px,46vw);display:block}
#boot .wm{width:min(140px,30vw);margin-top:18px}
#boot pre{position:absolute;left:clamp(16px,4vw,40px);bottom:clamp(16px,4vw,40px);margin:0;color:#8C8C85;white-space:pre-wrap;max-width:calc(100vw - 32px)}
#boot pre b{color:#10A862;font-weight:500}
#boot .skip{position:absolute;right:clamp(16px,4vw,40px);bottom:clamp(16px,4vw,40px);color:#8C8C85;border:1px solid #2A2A27;padding:8px 12px;border-radius:6px}

/* menu bar */
.menubar{position:fixed;inset:0 0 auto;height:38px;z-index:50;display:flex;align-items:center;gap:18px;padding:0 14px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.menubar .lk{width:17px;display:block}
.menubar b{font-weight:800}
.menubar .m{color:#44443F;font-weight:500}
.menubar .m:hover{color:var(--ink)}
.menubar .sp{flex:1}
.menubar .k{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:5px 10px;border-radius:6px}
.menubar .k canvas{width:22px;height:13px}

/* desktop */
.desk{position:fixed;inset:38px 0 0;background-image:radial-gradient(#CFCFC7 1px,transparent 1px);background-size:22px 22px}
.wall{position:absolute;right:6vw;bottom:14vh;width:min(46vw,620px);opacity:.9;pointer-events:none}
.wall svg{width:100%;display:block}
.icons{position:absolute;left:18px;top:22px;display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:10px 8px}
.ic{width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;text-align:center}
.ic:hover,.ic:focus-visible{background:rgba(11,11,11,.06)}
.ic .tile{width:58px;height:58px;border-radius:12px;background:#fff;border:1.5px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:10px;box-shadow:0 2px 0 var(--ink)}
.ic .tile i{display:block;background:var(--ink)}
.ic .tile.g i{background:var(--green)}
.ic .tile.doc{flex-direction:column;align-items:stretch;justify-content:center;gap:5px}
.ic .tile.doc i{height:2px}
.ic span{font-size:12.5px;font-weight:600}

/* windows */
.win{position:absolute;background:var(--win);border:1.5px solid var(--ink);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.14),0 3px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;min-width:260px}
.win .tb{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 14px;border-bottom:1.5px solid var(--ink);cursor:grab;user-select:none;touch-action:none;flex:none}
.win .tb .code{display:flex;gap:2px;height:12px;align-items:stretch}
.win .tb .code i{display:block;background:var(--ink)}
.win.front .tb .code i{background:var(--green)}
.win .tb .ttl{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .tb .x{width:32px;height:32px;border-radius:6px;font-size:18px}
.win .tb .x:hover{background:var(--desk)}
.win .in{flex:1;overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
.item{display:flex;flex-direction:column;gap:6px;text-align:left}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--rule);transition:transform .3s}
.item:hover img{transform:translateY(-2px)}
.item b{font-size:13.5px}
.item small{color:var(--mute)}
.viewer img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:1.5px solid var(--ink)}
.viewer .t{padding:16px 18px 18px}
.viewer h3{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.viewer p{margin:8px 0 14px;color:#3C3C38}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.btn.g{background:var(--green)}
.readme{padding:22px 24px 26px}
.readme h1{margin:0 0 10px;font-size:clamp(28px,3.2vw,42px);line-height:1;letter-spacing:-.04em;font-weight:800}
.readme h1 em{font-style:normal;color:var(--green)}
.readme ol{padding-left:18px;margin:14px 0 0}
.readme li{margin-bottom:6px}
.chart{padding:18px}
.chart canvas{width:100%;height:170px;display:block}
.chart .lab{display:flex;justify-content:space-between;margin-top:8px}
.chart dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}
.chart dt{color:var(--mute)}
.chart dd{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.list{padding:8px 18px 18px}
.list div{padding:12px 0;border-bottom:1px solid var(--rule)}
.list b{display:block}
.list span{color:var(--mute)}

/* dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:40;display:flex;gap:6px;align-items:center;padding:7px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid var(--ink);border-radius:16px;max-width:calc(100vw - 24px);overflow-x:auto}
.dock button{height:44px;padding:0 12px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.dock button:hover{background:var(--desk)}
.dock .ask{background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center}
.dock .ask:hover{background:#222}
.dock .ask canvas{width:30px;height:18px}
.dock hr{width:1px;height:26px;border:0;background:var(--rule);margin:0 2px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:41;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* command bar = the assistant */
#pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(236,236,230,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#pal.open{display:flex}
.pbox{width:min(640px,calc(100vw - 24px));background:#fff;border:1.5px solid var(--ink);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.18),0 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;max-height:74vh}
.phead{display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;border-bottom:1.5px solid var(--ink)}
.phead canvas{width:44px;height:26px;flex:none}
.phead .bq-form{flex:1;display:flex}
.bq-in{flex:1;min-width:0;border:0;padding:18px 0;font:inherit;font-size:18px;font-weight:500;background:transparent}
.bq-in:focus{outline:none}
.bq-send{display:none}
.phead kbd{font:500 11px 'JetBrains Mono',monospace;color:var(--mute);border:1px solid var(--rule);padding:3px 6px;border-radius:5px}
.cmds{padding:6px}
.cmds:empty{display:none}
.cmd{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;text-align:left}
.cmd.sel{background:var(--desk)}
.cmd .ico{min-width:18px;display:flex;gap:1.5px;height:14px;align-items:stretch}
.cmd .ico i{display:block;background:var(--ink)}
.cmd.ask .ico i{background:var(--green)}
.cmd b{font-weight:600}
.cmd small{margin-left:auto;color:var(--mute)}
.pbody{overflow:auto;border-top:1px solid var(--rule)}
.pbody:empty{display:none}
.bq-log{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.bq-log:empty{display:none}
.bq-msg.user{font:500 11.5px 'JetBrains Mono',monospace;color:var(--mute)}
.bq-msg.user::before{content:"› "}
.bq-msg.bot{font-size:17px;line-height:1.5;font-weight:500}
.bq-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-top:1px solid var(--rule)}
.bq-chip{border:1px solid var(--rule);padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:500}
.bq-chip:hover{border-color:var(--ink)}
.bq-note{margin:0;padding:0 16px 12px;color:var(--mute);font-size:11px}

@media (max-width:760px){
  .menubar .m{display:none}
  .icons{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:repeat(4,1fr);right:10px;left:10px;top:14px;gap:4px}
  .ic{width:auto}
  .wall{right:50%;transform:translateX(50%);bottom:20vh;width:72vw}
  .win{left:8px !important;right:8px;top:8px !important;width:auto !important;height:calc(100% - 96px) !important}
  .win .tb{cursor:default}
  #pal{padding-top:52px}
}
</style>

<body>
<noscript><p style="padding:60px 20px;font:16px/1.5 system-ui">band. is a studio in Cairo: online stores, custom software, brand design, media buying and AI content. This desktop needs JavaScript — or see <a href="https://band-agents.github.io/band/">our portfolio</a> and DM <a href="https://www.instagram.com/band.cairo/">@band.cairo</a>.</p></noscript>
<div id="boot" aria-live="polite">
  <canvas id="bootCode" aria-hidden="true"></canvas>
  <span class="wm" id="bootWm"></span>
  <pre class="mono" id="log"></pre>
  <button class="skip mono" id="skip">Skip ↵</button>
</div>

<div class="menubar">
  <span class="lk" id="lk"></span><b>band. OS</b>
  <button class="m" data-open="stores">Stores</button><button class="m" data-open="brands">Brands</button><button class="m" data-open="software">Software</button><button class="m" data-open="results">Results</button><button class="m" data-open="contact">Contact</button>
  <span class="sp"></span>
  <span class="mono" id="clock">Cairo</span>
  <button class="k mono" id="kbtn"><canvas id="kCode" aria-hidden="true"></canvas>Ask ⌘K</button>
</div>

<main class="desk" id="desk">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <nav class="icons" id="icons" aria-label="Desktop"></nav>
</main>

<nav class="dock" id="dock" aria-label="Dock">
  <button class="ask" id="dockAsk"><canvas id="dockCode" aria-hidden="true"></canvas>bqnd</button><hr><span id="dockWins" style="display:flex;gap:4px"></span>
</nav>
<div class="toast" id="toast">Press ⌘K — or just ask me anything.</div>

<div id="pal" role="dialog" aria-label="Ask band.">
  <div class="pbox">
    <div class="phead"><canvas id="pCode" aria-hidden="true"></canvas><div id="palChat" style="flex:1;display:contents"></div><kbd>esc</kbd></div>
    <div class="cmds" id="cmds" role="listbox"></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<script>
/* bqnd core — shared by all six directions.
   · The logo: the 11 bars and the stroked wordmark, geometry copied from brand/_src/pp-barcode.html.
   · code(): an animated barcode on canvas — rest, breathe, think (a wave), speak (driven by the reply as it
     streams), data (bars set to values) and scan.
   · Assistant: asks Claude through the page's `sample` capability, can show work and move the page with tools,
     and falls back to written answers when Claude isn't available. It only knows band.'s real facts. */
const BQ = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- logo ---------- */
  const RAW = [7,3,3,11,4,3,7,3,11,3,4,7,3,3,11,4,7,3,3,7,11,3];
  const bars = []; let x = 96;
  RAW.forEach((b, i) => { if (i % 2 === 0) bars.push({ x, w: b }); x += b + (i % 3 === 0 ? 5 : 4); });
  const X0 = 96, X1 = 301;                           // bars span 205 units, 150 tall
  const BARS = bars.map(b => ({ x: (b.x - X0) / (X1 - X0), w: b.w / (X1 - X0) }));
  const WM_PATHS = ['M2.944 2.944V32.448', 'C17.664 32.448 14.72', 'C73.797 32.512 14.72', 'M88.517 32.512V65.04',
    'M116.919 47.104V17.92', 'M116.919 31.2A13.408 13.408 0 0 1 143.735 31.2', 'M143.735 31.2V47.104',
    'C186.147 32.448 14.72', 'M200.867 2.944V32.448'];
  function wmInner(color = 'currentColor', sw = 5.9) {
    const els = WM_PATHS.map(p => p[0] === 'C'
      ? (([cx, cy, r]) => `<circle cx="${cx}" cy="${cy}" r="${r}"/>`)(p.slice(1).split(' '))
      : `<path d="${p}"/>`).join('');
    return `<g fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${els}</g>`;
  }
  function wordmark(color = 'currentColor', sw = 5.9, cls = '') {
    return `<svg class="${cls}" viewBox="-4 -4 212 78" aria-label="band." role="img">${wmInner(color, sw)}</svg>`;
  }
  // The full lockup as SVG: bars + wordmark, in the logo's own proportions.
  function lockup(color = 'currentColor') {
    const r = bars.map(b => `<rect x="${b.x - X0}" y="0" width="${b.w}" height="150" fill="${color}"/>`).join('');
    const s = 98 / 206.76, tx = (205 - 98) / 2 + 2.95 * s, ty = 170 + 2.95 * s;
    const wm = wmInner(color);
    return `<svg viewBox="0 0 205 206" role="img" aria-label="band.">${r}<g transform="translate(${tx} ${ty}) scale(${s})">${wm}</g></svg>`;
  }
  // Draw the wordmark stroke by stroke.
  function drawIn(svg, { dur = 1400, delay = 0 } = {}) {
    if (!svg || reduced) return;
    svg.querySelectorAll('path,circle').forEach((el, i) => {
      const L = el.getTotalLength ? el.getTotalLength() : 100;
      el.style.strokeDasharray = L; el.style.strokeDashoffset = L;
      el.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }],
        { duration: dur * 0.55, delay: delay + i * (dur * 0.05), easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' });
    });
  }

  /* ---------- animated barcode ---------- */
  function code(canvas, o = {}) {
    const opt = Object.assign({ color: '#0B0B0B', accent: '#1FA35C', align: 'bottom', mode: 'breathe', scan: false, minH: 0.12 }, o);
    const ctx = canvas.getContext('2d');
    const st = BARS.map(() => ({ h: 1, v: 0, t: 1, hot: 0 }));
    let mode = opt.mode, energy = 0, scanX = -0.2, hot = new Set(), raf = 0, W = 0, H = 0;
    const t0 = performance.now();
    function resize() {
      const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
      W = r.width; H = r.height; canvas.width = Math.max(1, W * d); canvas.height = Math.max(1, H * d); ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    const ro = new ResizeObserver(resize); ro.observe(canvas); resize();
    const wob = (i, t) => 0.5 + 0.5 * Math.sin(t * 11 + i * 2.1) * Math.sin(t * 6.3 + i * 1.3);
    function frame(now) {
      const t = (now - t0) / 1000;
      st.forEach((s, i) => {
        let target = s.t;
        if (mode === 'rest') target = 1;
        else if (mode === 'breathe') target = 0.9 + 0.1 * Math.sin(t * 1.4 + i * 0.6);
        else if (mode === 'think') target = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 5.5 - i * 0.72));
        else if (mode === 'speak') target = opt.minH + (1 - opt.minH) * Math.min(1, 0.25 + energy * wob(i, t));
        if (reduced && mode !== 'data') target = 1;
        s.v += (target - s.h) * 0.16; s.v *= 0.72; s.h += s.v;
        s.hot += ((hot.has(i) ? 1 : 0) - s.hot) * 0.15;
      });
      energy *= 0.93;
      if (opt.scan && !reduced) { scanX += 0.006; if (scanX > 1.25) scanX = -0.25; }
      ctx.clearRect(0, 0, W, H);
      BARS.forEach((b, i) => {
        const s = st[i], h = Math.max(1, H * Math.max(0, Math.min(1.05, s.h)));
        const bx = b.x * W, bw = Math.max(1, b.w * W);
        const y = opt.align === 'bottom' ? H - h : opt.align === 'top' ? 0 : (H - h) / 2;
        ctx.fillStyle = s.hot > 0.5 ? opt.accent : opt.color;
        if (opt.scan) { const d = Math.abs(b.x + b.w / 2 - scanX); if (d < 0.05) ctx.fillStyle = opt.accent; }
        ctx.fillRect(bx, y, bw, h);
      });
      if (opt.scan && !reduced && scanX > -0.05 && scanX < 1.05) {
        ctx.fillStyle = opt.accent; ctx.globalAlpha = 0.9; ctx.fillRect(scanX * W - 1, -2, 2, H + 4); ctx.globalAlpha = 1;
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return {
      mode(m) { mode = m; }, get currentMode() { return mode; },
      set(values) { mode = 'data'; st.forEach((s, i) => { s.t = values[i % values.length]; }); },
      kick(a = 0.6) { energy = Math.min(1.4, energy + a); },
      hot(i) { hot = new Set([].concat(i).filter(n => n >= 0)); },
      color(c, a) { opt.color = c; if (a) opt.accent = a; },
      scan(on) { opt.scan = on; },
      stop() { cancelAnimationFrame(raf); ro.disconnect(); },
    };
  }

  /* ---------- band.'s real work and facts ---------- */
  const WORK = [
    { id: 'womensecret', name: 'Women’secret', kind: 'Store', img: 'ws-photo', shot: 'ws-home', line: 'Egypt, Jordan and Kuwait on one Shopify build. One design system; each country keeps its own currency, branches and delivery.' },
    { id: 'alo', name: 'Alo Yoga', kind: 'Store', img: 'alo-cap', shot: 'alo-pdp', line: 'Shopify storefront, product pages and cross-selling, and the Alo Yoga Egypt store rebuilt to read right to left in Arabic.' },
    { id: 'volcom', name: 'Volcom', kind: 'Store · Media', img: 'skate', shot: 'volcom', line: 'Collections and product pages, and paid media for Volcom Spain: €18,892 in ads became €63,034 in sales in 30 days.' },
    { id: 'oshoplin', name: 'Oshoplin', kind: 'Store', img: 'oshoplin', shot: 'oshoplin', line: 'A multi-brand Shopify store.' },
    { id: 'ayas', name: 'AYA-S', kind: 'Website', img: 'aya', shot: 'aya', line: 'A Scandinavian fashion brand. We designed and built aya-s.com.' },
    { id: 'labesny', name: 'Labesny', kind: 'App', img: 'labesny', shot: 'labesny', line: 'Shopping app for Kuwait: eighteen brands in one bag, KNET checkout, club points and full Arabic.' },
    { id: 'fig', name: 'FIG', kind: 'App', img: 'fig', shot: 'fig', line: 'Shopping app for Egypt, and figeg.com’s 6,730 products moving to Shopify.' },
    { id: 'sloth', name: 'Sloth', kind: 'Brand', img: 'sloth', shot: 'sloth-p2', line: 'Visual identity guidelines for a furniture brand, page by page.' },
    { id: 'handler', name: 'Handler', kind: 'Brand', img: 'handler', shot: 'handler', line: 'Identity and company profile for an auto service.' },
    { id: 'end', name: 'end.', kind: 'Brand', img: 'end', shot: 'end', line: 'Brand guidelines.' },
    { id: 'guesswhat', name: 'Guess What', kind: 'Brand', img: 'guesswhat', shot: 'guesswhat', line: 'Brand book.' },
    { id: 'mas', name: 'MAS', kind: 'Design', img: 'mas', shot: 'mas', line: 'Mood, social and campaign design.' },
    { id: 'thoth', name: 'THOTH', kind: 'Software', img: 'thoth', shot: 'thoth', line: 'Our own retail and garment ERP: POS, catalogue, branches, loyalty and two-way Shopify sync, in English and Arabic.' },
    { id: 'studio', name: 'Studio', kind: 'Software', img: 'studio', shot: 'studio', line: 'Our agency OS: docs, tasks and client portals with live Meta, TikTok and Shopify numbers.' },
  ];
  const byId = Object.fromEntries(WORK.map(w => [w.id, w]));

      const p = Math.max(0, Math.min(1, (now - start) / dur));
      let budget = Math.floor(total * p);

    if (id.startsWith('w:')) { const w = BQ.byId[id.slice(2)]; if (!w) return; return { title: w.name, size: [480, 470], render: el => {
      el.innerHTML = `<div class="viewer"><img src="img/${w.img}.jpg" alt="${w.name}"><div class="t"><span class="mono" style="color:var(--mute)">${w.kind}</span><h3>${w.name}</h3><p>${w.line}</p><button class="btn g">Ask bqnd about ${w.name}</button></div></div>`;
      el.querySelector('.btn').onclick = () => { openPal(); asst.ask('Tell me about ' + w.name); };
    } }; }
    if (id === 'readme') return { title: 'Readme', render: el => {
      el.innerHTML = `<div class="readme"><span class="mono" style="color:var(--mute)">band. — Cairo, Egypt</span><h1>We don’t overthink it. <em>We ship it.</em></h1>
      <p>We build online stores, write the software businesses run on, shape brands and buy the media — for brands in Egypt, the Gulf and Europe, in English and Arabic.</p>
      <b>How a build runs</b><ol><li>A 20-minute call.</li><li>A written brief and quote within 48 hours.</li><li>Weekly previews you can click.</li><li>Launch, tested on real phones.</li><li>Media, content and improvements, reported monthly.</li></ol></div>`;
    } };
    if (id === 'results') return { title: 'Results — Volcom Spain', render: el => {
      el.innerHTML = `<div class="chart"><span class="mono" style="color:var(--mute)">30 days · spend against sales, to scale</span><canvas style="margin-top:12px"></canvas>
      <div class="lab mono"><span>€18,892 ad spend</span><span style="color:var(--green)">€63,034 sales</span></div>
      <dl><div><dt class="mono">Return on ad spend</dt><dd style="color:var(--green)">3.34×</dd></div><div><dt class="mono">Orders</dt><dd>788</dd></div><div><dt class="mono">Per order</dt><dd>€23.98</dd></div><div><dt class="mono">Markets on one build</dt><dd>EG · JO · KW</dd></div></dl></div>`;
      const c = BQ.code(el.querySelector('canvas'), { color: '#0B0B0B', accent: '#10A862', mode: 'data' });
      c.set(Array(11).fill(0)); setTimeout(() => { c.set([.3, .3, .3, .3, .3, 1, 1, 1, 1, 1, 1]); c.hot([5, 6, 7, 8, 9, 10]); }, 300);
      el.closest('.win') ? (el.closest('.win')._stop = c.stop) : setTimeout(() => el.closest('.win') && (el.closest('.win')._stop = c.stop));
    } };
    if (id === 'services') return { title: 'Services', render: el => {
      el.innerHTML = `<div class="list">${[['Ecommerce development', 'Shopify and headless, one market or many.'], ['Custom software', 'ERPs, portals, dashboards, apps.'], ['Design & brand', 'Identities and full guideline decks.'], ['Media buying', 'Meta and Google, on real numbers.'], ['AI content', 'Visuals, copy and video, faster.'], ['Creative tech', 'Campaign visuals that run live in the browser.']].map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>`;
    } };
    if (id === 'contact') return { title: 'Start a build', render: el => {
      el.innerHTML = `<div class="readme"><h1>Let’s build something that <em>ships.</em></h1><p>Tell bqnd what you sell and where. It asks two more questions, then we take it from there with a 20-minute call.</p>
      <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" id="cStart">Start with bqnd</button><a class="btn" href="https://www.instagram.com/band.cairo/" target="_blank" rel="noopener">DM @band.cairo</a></p></div>`;
      el.querySelector('#cStart').onclick = () => { openPal(); asst.ask('I want to start a build.'); };
    } };
  }

  /* ---------- the assistant: a command bar ---------- */
  const kCode = BQ.code($('#kCode'), { color: '#FFFFFF', accent: '#10A862', mode: 'breathe' });
  const dCode = BQ.code($('#dockCode'), { color: '#FFFFFF', accent: '#10A862', mode: 'breathe' });
  const pCode = BQ.code($('#pCode'), { color: '#0B0B0B', accent: '#10A862', mode: 'breathe', minH: .1 });
  const pal = $('#pal');
  const asst = new BQ.Assistant({
    context: () => { const f = $('.win.front'); return f ? 'the "' + f.getAttribute('aria-label') + '" window on the band. OS desktop' : 'the band. OS desktop'; },
    actions: {
      show: ids => ids.slice(0, 3).forEach((i, n) => setTimeout(() => openWin('w:' + i), n * 160)),
      go: s => { const m = { work: 'stores', stores: 'stores', brands: 'brands', software: 'software', results: 'results', services: 'services', contact: 'contact', top: 'readme' }[s]; if (m) openWin(m); },
    },
    onState: (s, n) => {
      [kCode, dCode, pCode].forEach(c => { c.mode(s === 'think' ? 'think' : s === 'speak' ? 'speak' : 'breathe'); if (s === 'speak') c.kick(.15 + (n || 1) * .03); });
    },
  });
  const ui = BQ.chat($('#palChat'), asst, { placeholder: 'Ask anything, or open a window…', chips: ['Show me your stores', 'What did Volcom get?', 'Do you build apps?', 'عايز أبدأ مشروع'] });
  // move the log, chips and note under the command list
  ['.bq-log', '.bq-chips', '.bq-note'].forEach(s => $('#pbody').append($('#palChat ' + s)));
  const CMDS = [
    ...Object.entries(FOLDERS).map(([id, f]) => ({ t: 'Open ' + f.title, k: 'folder', run: () => openWin(id) })),
    ...BQ.WORK.map(w => ({ t: w.name, k: w.kind, run: () => openWin('w:' + w.id) })),
    { t: 'Open Results', k: 'chart', run: () => openWin('results') }, { t: 'Open Readme', k: 'doc', run: () => openWin('readme') },
    { t: 'Services', k: 'doc', run: () => openWin('services') }, { t: 'Start a build', k: 'action', run: () => openWin('contact') },
  ];
  let sel = 0, shown = [];
  function renderCmds() {
    const q = ui.input.value.trim().toLowerCase();
    if (!q) { $('#cmds').innerHTML = ''; shown = []; return; }
    shown = [{ t: `Ask bqnd — “${ui.input.value.trim()}”`, k: '↵', ask: true }, ...CMDS.filter(c => c.t.toLowerCase().includes(q)).slice(0, 5)];
    sel = Math.min(sel, shown.length - 1);
    $('#cmds').innerHTML = shown.map((c, i) => `<button class="cmd ${c.ask ? 'ask' : ''} ${i === sel ? 'sel' : ''}" data-i="${i}" role="option" aria-selected="${i === sel}"><span class="ico">${glyph(4, i)}</span><b></b><small class="mono">${c.k}</small></button>`).join('');
    $$('.cmd').forEach((b, i) => { b.querySelector('b').textContent = shown[i].t; b.querySelectorAll('.ico i').forEach(x => x.style.height = '100%'); b.onclick = () => runCmd(i); });
  }
  function runCmd(i) {
    const c = shown[i]; if (!c) return;
    if (c.ask) { const v = ui.input.value; ui.input.value = ''; renderCmds(); asst.ask(v); }
    else { c.run(); ui.input.value = ''; renderCmds(); closePal(); }
  }
  ui.input.addEventListener('input', () => { sel = 0; renderCmds(); pCode.kick(.2); });
  ui.input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!shown.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length; renderCmds(); }
    if (e.key === 'Enter' && shown.length && sel > 0) { e.preventDefault(); runCmd(sel); }
  });
  ui.input.form?.addEventListener('submit', () => setTimeout(renderCmds));
  function openPal() { pal.classList.add('open'); setTimeout(() => ui.input.focus(), 30); }
  function closePal() { pal.classList.remove('open'); }
  pal.addEventListener('click', e => { if (e.target === pal) closePal(); });
  $('#kbtn').onclick = openPal; $('#dockAsk').onclick = openPal;
  addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.classList.contains('open') ? closePal() : openPal(); }
    else if (e.key === 'Escape' && pal.classList.contains('open')) closePal();
    else if (e.key === '/' && booted && !pal.classList.contains('open') && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); openPal(); }
  });
})();
</script>
</body>
</html>
